<div class="drawer-overlay" *ngIf="isOpen" (click)="close()"></div>

<div class="drawer-container clay-panel elevated-card-3d" [class.open]="isOpen">
  <div class="drawer-header">
    <div class="ai-brand">
      <div class="gold-seal-emboss header-seal">
        <span class="seal-glyph">✨</span>
      </div>
      <div>
        <h3 class="serif-title">MENTORHUB <span class="terracotta-text">ASSISTANT</span></h3>
        <span class="sub-status serif-title">Gemini Assistant Core Active</span>
      </div>
    </div>
    <button class="close-btn tactile-btn-3d" (click)="close()">✕</button>
  </div>

  <div class="drawer-body debossed-track">
    <div class="chat-messages list-stagger">
      <div *ngFor="let msg of messages" [class]="'chat-bubble ' + msg.sender + ' elevated-card-3d'">
        <div class="bubble-header">
          <span class="sender-tag serif-title">{{ msg.sender === 'ai' ? '✨ GEMINI' : '👤 USER' }}</span>
          <span class="time-tag serif-title">{{ msg.time }}</span>
        </div>
        <p class="bubble-text serif-title">{{ msg.text }}</p>
      </div>

      <div class="chat-bubble ai thinking elevated-card-3d" *ngIf="isGenerating">
        <span class="thinking-dots serif-title"><span>.</span><span>.</span><span>.</span> Synthesizing Neural Architectural Recommendations</span>
      </div>
    </div>

    <div class="suggested-prompts" *ngIf="messages.length < 5">
      <span class="section-title serif-title">⚡ QUICK PROMPT ACCELERATORS</span>
      <div class="prompt-chips">
        <button *ngFor="let p of suggestedPrompts" (click)="selectPrompt(p)" class="prompt-chip tactile-btn-3d serif-title">
          {{ p }}
        </button>
      </div>
    </div>
  </div>

  <div class="drawer-footer">
    <div class="input-wrapper 3d-inset-well">
      <input type="text" [(ngModel)]="userPrompt" (keyup.enter)="sendPrompt()" placeholder="Ask MentorHub AI Assistant about mentors, code, or goals..." class="serif-title" />
      <button (click)="sendPrompt()" class="btn-primary send-btn tactile-btn-3d serif-title">
        <span>✨ SEND</span>
        <span class="shine-sweep"></span>
      </button>
    </div>
  </div>
</div>
